<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codebase Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #000000;
    --surface: #0a0a0a;
    --border: #1f1f1f;
    --border-bright: #333333;
    --text: #cccccc;
    --text-dim: #555555;
    --text-bright: #ffffff;
    --accent: #00ff41;
    --accent-dim: rgba(0, 255, 65, 0.1);
    --red: #ff003c;
    --mono: 'Fira Code', monospace;
    --sans: 'Rajdhani', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; height: 100vh; display: grid; grid-template-rows: 50px 1fr; grid-template-columns: 300px 1fr; overflow: hidden; }
header { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border-bright); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
.logo { font-family: var(--sans); font-weight: 700; font-size: 18px; color: var(--text-bright); text-transform: uppercase; letter-spacing: 2px; }
.logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
.status-dot { width: 8px; height: 8px; background: var(--text-dim); margin-left: auto; transition: background .3s; }
.status-dot.online { background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: blink 2s infinite; }
.status-label { font-size: 11px; color: var(--text-dim); margin-left: 8px; text-transform: uppercase; letter-spacing: 1px; }
aside { background: var(--bg); border-right: 1px solid var(--border-bright); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-section { padding: 16px 20px; border-bottom: 1px dotted var(--border-bright); }
.sidebar-label { font-family: var(--sans); font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
.ingest-form { display: flex; flex-direction: column; gap: 10px; }
input[type=text], textarea { background: var(--surface); border: 1px solid var(--border-bright); color: var(--text-bright); font-family: var(--mono); font-size: 12px; padding: 10px 12px; outline: none; width: 100%; transition: border-color .2s ease, box-shadow .2s ease; }
textarea { font-size: 13px; line-height: 1.5; resize: none; flex: 1; max-height: 100px; }
input[type=text]:focus, textarea:focus { border-color: var(--accent); box-shadow: inset 0 0 8px var(--accent-dim); }
input[type=text]::placeholder, textarea::placeholder { color: var(--text-dim); }
.btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 8px 16px; text-align: center; text-transform: uppercase; letter-spacing: 1.5px; transition: all .1s ease; }
.btn:hover:not(:disabled) { background: var(--accent); color: var(--bg); box-shadow: 0 0 15px var(--accent-dim); }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { opacity: .3; cursor: not-allowed; border-color: var(--text-dim); color: var(--text-dim); }
.btn.secondary { border-color: var(--border-bright); color: var(--text-dim); }
.btn.secondary:hover:not(:disabled) { border-color: var(--text-bright); color: var(--text-bright); background: transparent; box-shadow: none; }
.repo-list { flex: 1; overflow-y: auto; padding: 10px 0; }
.repo-item { display: flex; align-items: center; padding: 10px 20px; cursor: pointer; border-left: 3px solid transparent; transition: all .15s; gap: 10px; }
.repo-item:hover { background: var(--surface); }
.repo-item.active { background: var(--accent-dim); border-left-color: var(--accent); }
.repo-name { font-size: 12px; color: var(--text-bright); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo-chunks { font-size: 10px; color: var(--accent); opacity: 0.8; }
.sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--border-bright); font-size: 10px; color: var(--text-dim); }
main { display: grid; grid-template-rows: 1fr auto; overflow: hidden; background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 100%); }
#chat { overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 24px; }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-dim); text-align: center; }
.empty-icon { font-size: 48px; color: var(--border-bright); }
.empty-title { font-family: var(--sans); font-size: 24px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 2px; }
.hint { background: var(--bg); border: 1px solid var(--border-bright); padding: 10px 16px; font-size: 12px; cursor: pointer; transition: all .2s ease; color: var(--text-dim); }
.hint:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--accent-dim); }
.message { display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border: 1px solid var(--border-bright); animation: slideUp .3s ease forwards; margin-bottom: 8px; }
.message.user { background: var(--bg); border-left: 4px solid var(--text-dim); align-self: flex-end; width: auto; max-width: 80%; }
.message.agent { background: var(--surface); border-left: 4px solid var(--accent); box-shadow: 5px 5px 0px rgba(0, 255, 65, 0.05); align-self: flex-start; width: 100%; }
.message-header { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.message-role { font-family: var(--sans); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
.message-role.user { color: var(--text-bright); }
.message-role.agent { color: var(--accent); }
.message-body { line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
.message.user .message-body { color: var(--text-bright); }
.message-meta { font-size: 10px; color: var(--text-dim); display: flex; gap: 12px; margin-top: 8px; border-top: 1px dotted var(--border-bright); padding-top: 8px; }
.meta-badge { background: var(--bg); border: 1px solid var(--border-bright); padding: 4px 8px; font-size: 10px; text-transform: uppercase; }
.typing-indicator { display: flex; gap: 6px; padding: 8px 0; }
.typing-indicator span { width: 8px; height: 12px; background: var(--accent); animation: type 1s infinite; opacity: 0.3; }
.typing-indicator span:nth-child(2) { animation-delay: .2s; }
.typing-indicator span:nth-child(3) { animation-delay: .4s; }
.input-area { border-top: 1px solid var(--border-bright); background: var(--bg); padding: 16px 32px; display: flex; flex-direction: column; gap: 12px; }
.input-row { display: flex; gap: 12px; align-items: flex-end; }
.input-actions { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-dim); font-family: var(--sans); text-transform: uppercase; letter-spacing: 1px; }
.current-repo-name { color: var(--accent); font-weight: 600; }
.progress-bar { height: 2px; background: var(--border-bright); overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s linear; box-shadow: 0 0 10px var(--accent); }
.toast { position: fixed; top: 20px; right: 20px; background: var(--bg); border: 1px solid var(--border-bright); border-left: 4px solid var(--text); padding: 12px 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; animation: slideInRight .3s ease; z-index: 100; box-shadow: 5px 5px 0px rgba(0,0,0,0.5); }
.toast.success { border-left-color: var(--accent); color: var(--accent); }
.toast.error { border-left-color: var(--red); color: var(--red); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); border-left: 1px solid var(--border); }
::-webkit-scrollbar-thumb { background: var(--border-bright); }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes type { 0%, 100% { transform: scaleY(1); opacity: 0.3; } 50% { transform: scaleY(1.5); opacity: 1; } }
@keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>
<header>
  <div class="logo">codebase<span>.</span>agent</div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-label" id="statusLabel">connecting...</div>
  </div>
</header>
<aside>
  <div class="sidebar-section">
    <div class="sidebar-label">Ingest Repo</div>
    <div class="ingest-form">
      <input type="text" id="repoUrl" placeholder="https://github.com/owner/repo"/>
      <div style="display:flex;gap:6px">
        <button class="btn" style="flex:1" onclick="ingestRepo()">Ingest</button>
        <button class="btn secondary" onclick="ingestRepo(true)">Force</button>
      </div>
      <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
  <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden;padding-bottom:0">
    <div class="sidebar-label">Indexed Repos</div>
    <div class="repo-list" id="repoList"><div style="padding:8px 16px;font-size:11px;color:var(--text-dim)">No repos yet</div></div>
  </div>
  <div class="sidebar-footer"><span id="providerLabel">provider: ollama</span></div>
</aside>
<main>
  <div id="chat">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">◈</div>
      <div class="empty-title">Ask about any codebase</div>
      <div style="font-size:12px;color:var(--text-dim);max-width:340px;line-height:1.6">Ingest a GitHub repo on the left, then ask questions. Get answers with exact file paths and line numbers.</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px" id="hintList"></div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="questionInput" rows="2" placeholder="Ask a question about the codebase..." onkeydown="handleKeyDown(event)"></textarea>
      <button class="btn" id="sendBtn" onclick="sendQuery()" style="height:44px;padding:0 16px">Send</button>
    </div>
    <div class="input-actions">
      <div style="display:flex;align-items:center;gap:6px"><span>repo:</span><span class="current-repo-name" id="currentRepoName">none selected</span></div>
    </div>
  </div>
</main>
<script>
const API = '';
let activeRepo = null;
const HINTS = [
    'How does authentication work?',
    'Where is the database connection initialized?',
    'What does the main entry point do?',
    'Which functions handle HTTP routing?'
];
async function init() {
    await checkHealth();
    await loadRepos();
    renderHints();
    setInterval(checkHealth, 15000);
}
async function checkHealth() {
    try {
        const r = await fetch(`${API}/health`);
        const ok = r.ok;
        document.getElementById('statusDot').className = 'status-dot ' + (ok ? 'online' : '');
        document.getElementById('statusLabel').textContent = ok ? 'online' : 'offline';
        
        if (ok) {
            const d = await r.json();
            document.getElementById('providerLabel').textContent = `provider: ${d.config?.llm_provider || 'unknown'}`;
        }
    } catch {
        document.getElementById('statusDot').className = 'status-dot';
        document.getElementById('statusLabel').textContent = 'offline';
    }
}
function renderHints() {
    const el = document.getElementById('hintList');
    HINTS.forEach(h => {
        const d = document.createElement('div');
        d.className = 'hint';
        d.textContent = `"${h}"`;
        d.onclick = () => {
            document.getElementById('questionInput').value = h;
            document.getElementById('questionInput').focus();
        };
        el.appendChild(d);
    });
}
async function loadRepos() {
    try {
        const r = await fetch(`${API}/ingest/repos`);
        const d = await r.json();
        renderRepoList(d.repos || []);
    } catch {}
}
function renderRepoList(repos) {
    const el = document.getElementById('repoList');
    if (!repos.length) {
        el.innerHTML = '<div style="padding:8px 16px;font-size:11px;color:var(--text-dim)">No repos yet</div>';
        return;
    }
    
    el.innerHTML = '';
    repos.forEach(repo => {
        const d = document.createElement('div');
        d.className = 'repo-item' + (repo.repo_name === activeRepo ? ' active' : '');
        d.innerHTML = `
            <span style="font-size:10px;color:var(--accent)">◆</span>
            <span class="repo-name">${repo.repo_name}</span>
            <span class="repo-chunks">${repo.chunks}c</span>
        `;
        d.onclick = () => selectRepo(repo.repo_name, d);
        el.appendChild(d);
    });
}
function selectRepo(name, el) {
    activeRepo = name;
    document.querySelectorAll('.repo-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('currentRepoName').textContent = name;
}
async function ingestRepo(force = false) {
    const url = document.getElementById('repoUrl').value.trim();
    if (!url) return;
    
    const bar = document.getElementById('progressBar');
    const fill = document.getElementById('progressFill');
    bar.style.display = 'block';
    fill.style.width = '20%';
    
    try {
        fill.style.width = '60%';
        const r = await fetch(`${API}/ingest/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ github_url: url, force })
        });
        fill.style.width = '100%';
        const d = await r.json();
        
        if (r.ok) {
            showToast(`✓ ${d.repo_name} — ${d.chunks_indexed} chunks indexed`, 'success');
            document.getElementById('repoUrl').value = '';
            await loadRepos();
        } else {
            showToast(`✗ ${d.detail}`, 'error');
        }
    } catch (e) {
        showToast(`✗ ${e.message}`, 'error');
    } finally {
        setTimeout(() => {
            bar.style.display = 'none';
            fill.style.width = '0%';
        }, 800);
    }
}
function handleKeyDown(e) {
    if (e.key === 'Enter' && e.shiftKey) {
        return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuery();
    }
}
async function sendQuery() {
    const input = document.getElementById('questionInput');
    const question = input.value.trim();
    if (!question) return;
    
    if (!activeRepo) {
        showToast('Select a repo first', 'error');
        return;
    }
    
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    input.value = '';
    document.getElementById('emptyState')?.remove();
    
    appendMessage('user', question);
    const thinking = appendThinking();
    
    try {
        const r = await fetch(`${API}/query/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repo_name: activeRepo, question, n_chunks: 8 })
        });
        const d = await r.json();
        thinking.remove();
        
        if (r.ok) {
            appendMessage('agent', d.answer, { model: d.model_used, chunks: d.chunks_used });
        } else {
            appendMessage('agent', `Error: ${d.detail}`);
        }
    } catch (e) {
        thinking.remove();
        appendMessage('agent', `Error: ${e.message}`);
    } finally {
        sendBtn.disabled = false;
    }
}
function appendMessage(role, text, meta = null) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    
    let metaHtml = '';
    if (meta) {
        metaHtml = `
            <div class="message-meta">
                <span class="meta-badge">model: ${meta.model}</span>
                <span class="meta-badge">chunks: ${meta.chunks}</span>
            </div>
        `;
    }
    
    div.innerHTML = `
        <div class="message-header">
            <span class="message-role ${role}">${role === 'user' ? '▸ you' : '◈ agent'}</span>
        </div>
        <div class="message-body">${escapeHtml(text)}</div>
        ${metaHtml}
    `;
    
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}
function appendThinking() {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message agent';
    div.innerHTML = `
        <div class="message-header">
            <span class="message-role agent">◈ agent</span>
        </div>
        <div class="message-body">
            <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}
function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function showToast(msg, type = '') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
}
init();
</script>
</body>
</html>
